name: Binance USD-M Reference Strategy Backtest

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "research/reference_futures_backtest.py"
      - "tests/test_reference_futures_backtest.py"
      - ".github/workflows/reference-futures-backtest.yml"
  push:
    branches: [main]
    paths:
      - "research/reference_futures_backtest.py"
      - "tests/test_reference_futures_backtest.py"
      - ".github/workflows/reference-futures-backtest.yml"

permissions:
  contents: read

concurrency:
  group: reference-futures-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and unit test
        run: |
          python -m py_compile research/reference_futures_backtest.py
          python -m unittest tests.test_reference_futures_backtest -v
      - name: Run historical Binance USD-M backtest
        timeout-minutes: 50
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u research/reference_futures_backtest.py
      - name: Upload funding-aware backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-usdm-reference-futures-backtest
          path: |
            research_results/reference_futures/
            research_cache/usdm/
          if-no-files-found: warn
          retention-days: 30
