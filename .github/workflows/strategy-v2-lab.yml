name: Strategy V2 Futures Research Lab
on:
  pull_request:
    branches: [main]
    paths:
      - "research/strategy_v2_lab.py"
      - "tests/test_strategy_v2_lab.py"
      - ".github/workflows/strategy-v2-lab.yml"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategy-v2-futures-research
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m py_compile research/strategy_v2_lab.py
      - run: python -m unittest discover -s tests -p 'test_strategy_v2_lab.py' -v
  futures-research:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run USDT-M strategy comparison
        timeout-minutes: 50
        env:
          PYTHONUNBUFFERED: "1"
          V2_RESEARCH_START: "2021-01-01"
        run: python -u research/strategy_v2_lab.py
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v2-futures-research
          path: |
            research_results/v2_futures/
            research_cache/v2_futures/
          if-no-files-found: warn
          retention-days: 30
