name: Telegram Control Panel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-control-panel
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile bot.py panel.py

      - name: Poll and handle Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_REPO: mostafasp209-ship-it/crypto-signal-bot
          GH_BRANCH: main
          PYTHONUNBUFFERED: "1"
        run: python -u panel.py --once

      - name: Persist Telegram users and update offset
        if: always()
        run: |
          if [ -f users.json ] && [ -n "$(git status --porcelain -- users.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add users.json
            git commit -m "Persist Telegram panel state [skip ci]" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
