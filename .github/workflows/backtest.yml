name: Historical Strategy Backtest

on:
  push:
    branches: [main]
    paths:
      - "backtest.py"
      - "bot.py"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backtest
        run: python -m py_compile bot.py backtest.py
      - name: Run historical backtest
        run: python -u backtest.py --exchange binanceus --symbols BTC/USDT,ETH/USDT,SOL/USDT --limit 500 --output backtest-results.json
      - name: Upload detailed results
        if: always() && hashFiles('backtest-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: price-action-backtest-results
          path: backtest-results.json
          if-no-files-found: warn
