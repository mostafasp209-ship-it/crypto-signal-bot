name: Pull request safety tests

on:
  pull_request:
    paths:
      - "bot.py"
      - "config.py"
      - "panel.py"
      - "safety_filters.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile bot and tests
        run: python -m py_compile bot.py config.py panel.py safety_filters.py
      - name: Smoke-import runtime modules
        run: python -c "import bot, config, panel, safety_filters"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
