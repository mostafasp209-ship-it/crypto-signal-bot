name: Research historical strategy comparison

on:
  workflow_dispatch:
  push:
    branches:
      - research/historical-strategy-comparison
    paths:
      - "research/historical_comparison_backtest.py"
      - ".github/workflows/research-backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/historical-strategy-comparison
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install ccxt pandas numpy
      - name: Run historical comparison
        run: python research/historical_comparison_backtest.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-backtest-report
          path: comparison-backtest-report.json
          retention-days: 30
