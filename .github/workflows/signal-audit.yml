name: Manual signal outcome audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate audit report when log is available
        shell: bash
        run: |
          if [ ! -f signals.json ]; then
            echo "::notice::No signals.json in this checkout. The bot's runtime state is not automatically copied into GitHub."
            {
              echo "## Signal outcome audit"
              echo "Skipped: `signals.json` is absent from this checkout."
              echo "For privacy and state-integrity reasons, runtime logs are not committed automatically. Run `python analyze_signals.py --input /path/to/signals.json --out outcome-report.json` where the runtime log is available."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python analyze_signals.py --input signals.json --out outcome-report.json
          {
            echo "## Signal outcome audit"
            echo "Generated `outcome-report.json` from the checked-out signal log."
            echo "This is a descriptive audit of recorded outcomes, not an independent candle backtest."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: hashFiles('outcome-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-outcome-audit
          path: outcome-report.json
          if-no-files-found: error
          retention-days: 30
