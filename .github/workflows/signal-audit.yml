name: Weekly signal outcome audit

on:
  schedule:
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate audit report
        run: |
          if [ ! -f signals.json ]; then
            echo "signals.json is not present in this checkout; there is no persisted signal log to audit."
            exit 1
          fi
          python analyze_signals.py --input signals.json --out outcome-report.json
      - name: Upload report
        if: always() && hashFiles('outcome-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: signal-outcome-audit
          path: outcome-report.json
          if-no-files-found: error
          retention-days: 30
