name: Strategy and Safety Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/rsi-stoch-usdtm-rr15

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile bot.py config.py exchange.py indicators.py market_data.py notifications.py panel.py risk.py safety_filters.py strategy.py storage.py utils.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
