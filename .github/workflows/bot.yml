name: Crypto Signal Pro + Telegram Panel

on:
  schedule:
    # Telegram panel polling.
    - cron: "*/5 * * * *"
    # Scan the market every 15 minutes; manage active signals and poll panel every 5 minutes.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crypto-signal-pro-panel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile bot.py panel.py

      - name: Run market scanner (every 15 minutes)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2,17,32,47 * * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Manage active signals every 5 minutes
        if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py --manage-only

      - name: Poll Telegram panel
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_REPO: mostafasp209-ship-it/crypto-signal-bot
          GH_PAT: ${{ github.token }}
          GH_BRANCH: main
          PYTHONUNBUFFERED: "1"
        run: python -u panel.py --once

      - name: Persist bot and panel state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for file in signals.json users.json; do
            if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              git add "$file"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git commit -m "Persist bot and Telegram panel state [skip ci]" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
