name: Crypto Signal Pro + Telegram Panel

on:
  schedule:
    # Poll the Telegram panel every 5 minutes; scanner is gated to every 4 hours below.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signal-pro-panel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile bot.py panel.py

      - name: Run market scanner (every 4 hours)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { [ "$(date -u +%M)" -lt 5 ] && [ "$(( $(date -u +%H) % 4 ))" -eq 0 ]; }; then
            python -u bot.py
          else
            echo "Outside the 4-hour scan window; scanner skipped."
          fi

      - name: Poll Telegram panel
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_REPO: mostafasp209-ship-it/crypto-signal-bot
          GH_BRANCH: main
          PYTHONUNBUFFERED: "1"
        run: python -u panel.py --once

      - name: Persist bot and panel state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for file in signals.json users.json; do
            if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              git add "$file"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git commit -m "Persist bot and Telegram panel state [skip ci]" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
