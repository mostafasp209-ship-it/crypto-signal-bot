name: Crypto Signal Pro + Telegram Panel

on:
  push:
    branches: [main]
    paths:
      - "bot.py"
      - ".github/workflows/bot.yml"
      - "requirements.txt"
      - "tests/**"
  schedule:
    # Manage active signals and poll the Telegram panel hourly to conserve Actions minutes.
    - cron: "17 * * * *"
    # Scan just after each UTC 4H candle opens.
    - cron: "2 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: crypto-signal-pro-panel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Validate Python syntax
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: python -m py_compile bot.py panel.py

      - name: Run strategy and position-management tests
        if: github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v

      - name: Run market scanner (just after each 4H candle opens)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '2 */4 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Manage active signals hourly
        if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py --manage-only

      - name: Poll Telegram panel hourly
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_REPO: mostafasp209-ship-it/crypto-signal-bot
          GH_PAT: ${{ github.token }}
          GH_BRANCH: main
          PYTHONUNBUFFERED: "1"
        run: python -u panel.py --once

      - name: Persist bot and panel state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for file in signals.json users.json; do
            if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then
              git add "$file"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git commit -m "Persist bot and Telegram panel state [skip ci]" || true
            git pull --rebase origin main
            git push origin HEAD:main
          fi
